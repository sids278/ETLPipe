[project]
name = "ch-sync"
version = "0.1.0"
description = "SQL Server -> ClickHouse sync using Change Tracking (no Kafka, no object storage)"
requires-python = ">=3.10"
dependencies = ["pyodbc>=5.1", "clickhouse-connect>=0.7.19", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ch-sync = "ch_sync.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
